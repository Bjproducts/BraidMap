[build]
  publish = "."

# ── Security headers (all routes) ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# ── HTML: always fresh (CDN may cache briefly, browser must revalidate) ──
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── CSS / JS: aggressive caching (filenames are static; bust via ?v= if needed) ──
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# ── JSON dataset: short cache + revalidate; updates show within 5 minutes ──
[[headers]]
  for = "/braidmap_data.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"
