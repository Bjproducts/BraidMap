<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Manage your BraidMap profile, view recently explored stylists, and update your details.">
<meta property="og:title" content="My Profile — BraidMap">
<meta property="og:description" content="Manage your BraidMap profile and recently viewed stylists.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺</text></svg>">
<title>My Profile — BraidMap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/braidmap.css">
<script defer data-domain="thebraidmap.com" src="https://plausible.io/js/script.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/log.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/data.js"></script>
<script src="js/core/nav.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/braidmap.js"></script>
<style>
/* ── Page-specific: Member Dashboard ── */
.hero-inner { display: flex; align-items: center; gap: 32px; position: relative; }
.hero-avatar {
  width: 80px; height: 80px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif); font-size: 36px; font-style: italic; color: white; flex-shrink: 0;
}
.hero-name {
  font-family: var(--font-serif); font-size: 52px; font-weight: 400;
  letter-spacing: -2px; color: white; line-height: 1;
}
.hero-name em { font-style: italic; color: rgba(255,255,255,.4); }

.body { max-width: 900px; margin: 0 auto; padding: 64px 80px; }
.section-label { margin-bottom: 20px; }
.section-title { margin-bottom: 28px; }

/* Edit form */
.edit-card { border: 1px solid var(--g200); border-radius: 12px; padding: 32px; margin-bottom: 48px; background: var(--white); }
.form-row { margin-bottom: 16px; }
.form-label { color: var(--g400); }
.form-actions { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.btn-save { padding: 10px 24px; font-size: 13px; }
.save-msg { font-size: 12px; color: var(--g400); font-family: var(--font-mono); opacity: 0; transition: opacity 0.3s; }
.save-msg.show { opacity: 1; }

/* Recently viewed */
.recent-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 48px; }
.rec-card { border: 1px solid var(--g200); border-radius: 10px; padding: 20px; text-decoration: none; transition: all 0.2s; display: block; background: var(--white); }
.rec-card:hover { background: var(--g100); border-color: var(--g400); transform: translateY(-2px); }
.rec-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.rec-avatar { width: 38px; height: 38px; background: var(--black); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-size: 15px; font-style: italic; color: white; }
.rec-city { font-family: var(--font-mono); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--g400); }
.rec-name { font-family: var(--font-serif); font-size: 16px; color: var(--black); margin-bottom: 3px; letter-spacing: -.3px; }
.rec-tags { font-family: var(--font-mono); font-size: 10px; color: var(--g400); line-height: 1.6; }

/* Empty state */
.empty { padding: 40px; text-align: center; border: 1px dashed var(--g200); border-radius: 10px; margin-bottom: 48px; }
.empty-title { font-family: var(--font-serif); font-size: 24px; color: var(--g200); margin-bottom: 8px; }
.empty-sub { font-size: 13px; color: var(--g400); margin-bottom: 20px; }
.empty-link { display: inline-flex; align-items: center; gap: 6px; background: var(--black); color: white; padding: 10px 22px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; transition: opacity 0.15s; }
.empty-link:hover { opacity: .85; }

/* Logout */
.danger-zone { border-top: 1px solid var(--g200); padding-top: 32px; display: flex; align-items: center; justify-content: space-between; }
.btn-logout { padding: 9px 20px; background: none; border: 1px solid var(--g200); border-radius: 6px; font-family: var(--font-sans); font-size: 13px; color: var(--g400); transition: all 0.15s; }
.btn-logout:hover { border-color: var(--black); color: var(--black); }
.danger-label { font-size: 12px; color: var(--g400); }

/* Not logged in */
.not-member { padding: 160px 80px; text-align: center; }
.not-member h2 { font-family: var(--font-serif); font-size: 48px; color: var(--g200); margin-bottom: 12px; letter-spacing: -2px; }
.not-member p { color: var(--g400); margin-bottom: 24px; font-size: 14px; }
.not-member a { background: var(--black); color: white; padding: 12px 28px; border-radius: 7px; text-decoration: none; font-size: 14px; font-weight: 600; }

@media (max-width: 1024px) {
  .body { padding: 48px 48px; }
  .recent-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  .hero-name { font-size: 36px; }
  .body { padding: 40px 24px; }
  .recent-grid { grid-template-columns: 1fr; }
  .not-member { padding: 120px 24px; }
  .not-member h2 { font-size: 36px; }
}
</style>
</head>
<body>

<a href="#app" class="skip-link">Skip to content</a>

<nav>
  <a href="index.html" class="logo"><div class="logo-mark">B</div>BraidMap</a>
  <ul class="nav-links" id="navLinks">
    <li><a href="braidmap-directory.html">Find a Stylist</a></li>
  </ul>
  <span id="navRight"></span>
  <button class="nav-hamburger" id="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  <div class="nav-mobile-menu" id="mobileMenu" role="navigation" aria-label="Mobile menu">
    <a href="braidmap-directory.html">Find a Stylist</a>
  </div>
</nav>

<main id="app" role="main">
  <div class="loading-state" aria-live="polite">
    <span class="loading-state-text">Loading profile...</span>
  </div>
</main>

<script>
let STYLISTS = [], TAG_LABELS = {};

function ini(n) { return (n.replace(/[^a-zA-Z]/g, '')[0] || 'M').toUpperCase(); }

function render() {
  const app = document.getElementById('app');

  if (!BM.isLoggedIn()) {
    app.innerHTML = '<div class="not-member">' +
      '<h2>Not signed up yet</h2>' +
      '<p>Create a free account to unlock the full BraidMap directory.</p>' +
      '<a href="index.html">Go to BraidMap →</a>' +
      '</div>';
    return;
  }

  const name = BM.getUser().name;
  const email = BM.getUser().email;
  const recent = BM.getRecent();
  const recentStylists = recent.map(function(id) { return STYLISTS.find(function(s) { return s.id === id; }); }).filter(Boolean);

  var recentHtml = recentStylists.length
    ? recentStylists.map(function(s) {
        return '<a href="braidmap-profile.html?id=' + BM.escAttr(s.id) + '" class="rec-card">' +
          '<div class="rec-top">' +
          '<div class="rec-avatar">' + ini(s.name) + '</div>' +
          '<span class="rec-city">' + BM.esc(s.city || 'BC') + '</span>' +
          '</div>' +
          '<div class="rec-name">' + BM.esc(s.name) + '</div>' +
          '<div class="rec-tags">' + s.tags.slice(0, 3).map(function(t) { return BM.esc(TAG_LABELS[t] || t); }).join(' · ') + '</div>' +
          '</a>';
      }).join('')
    : '<div class="empty">' +
      '<div class="empty-title">Nothing yet</div>' +
      '<p class="empty-sub">Start browsing and your recently viewed stylists will appear here.</p>' +
      '<a href="braidmap-directory.html" class="empty-link">Browse Stylists →</a>' +
      '</div>';

  app.innerHTML =
    '<div class="hero">' +
    '  <div class="hero-inner">' +
    '    <div class="hero-avatar">' + ini(name || 'Member') + '</div>' +
    '    <div class="hero-text">' +
    '      <span class="hero-eyebrow">Member Profile</span>' +
    '      <h1 class="hero-name">Hey, <em id="heroFirstName"></em></h1>' +
    '    </div>' +
    '  </div>' +
    '</div>' +
    '<div class="body">' +
    '  <span class="section-label">Your Details</span>' +
    '  <div class="edit-card">' +
    '    <div class="form-row">' +
    '      <div class="form-group">' +
    '        <label class="form-label" for="editName">Name</label>' +
    '        <input class="form-input" id="editName" type="text" placeholder="Your name">' +
    '      </div>' +
    '      <div class="form-group">' +
    '        <label class="form-label" for="editEmail">Email</label>' +
    '        <input class="form-input" id="editEmail" type="email" placeholder="Your email">' +
    '      </div>' +
    '    </div>' +
    '    <div class="form-actions">' +
    '      <button class="btn-save" id="saveBtn">Save Changes</button>' +
    '      <span class="save-msg" id="saveMsg" role="status">✓ Saved!</span>' +
    '    </div>' +
    '  </div>' +
    '  <span class="section-label">Recently Viewed</span>' +
    '  <h2 class="section-title">Stylists you\'ve <em>explored</em></h2>' +
    (recentStylists.length ? '<div class="recent-grid">' + recentHtml + '</div>' : recentHtml) +
    '  <div class="danger-zone">' +
    '    <span class="danger-label">Want to sign out?</span>' +
    '    <button class="btn-logout" id="logoutBtn">Sign Out</button>' +
    '  </div>' +
    '</div>';

  // Populate values safely via DOM (not template)
  var heroFirst = document.getElementById('heroFirstName');
  if (heroFirst) heroFirst.textContent = name.split(' ')[0] || 'there';
  var nameInput = document.getElementById('editName');
  var emailInput = document.getElementById('editEmail');
  if (nameInput) nameInput.value = name;
  if (emailInput) emailInput.value = email;

  // Wire event listeners
  var saveBtn = document.getElementById('saveBtn');
  if (saveBtn) saveBtn.addEventListener('click', saveChanges);
  var logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.addEventListener('click', function() { BM.logout(); });
}

function saveChanges() {
  var name = document.getElementById('editName').value.trim();
  var email = document.getElementById('editEmail').value.trim();
  if (!name) { if (BM.ui) BM.ui.toast('Please enter your name.', { type: 'error' }); return; }
  if (!email || email.indexOf('@') < 0) { if (BM.ui) BM.ui.toast('Please enter a valid email.', { type: 'error' }); return; }
  BM.login(name, email);

  // Update hero instantly
  var heroFirst = document.getElementById('heroFirstName');
  if (heroFirst) heroFirst.textContent = name.split(' ')[0];

  BM.renderNav();

  // Re-set form values safely
  var ni = document.getElementById('editName');
  var ei = document.getElementById('editEmail');
  if (ni) ni.value = BM.getUser().name;
  if (ei) ei.value = BM.getUser().email;

  var msg = document.getElementById('saveMsg');
  if (msg) {
    msg.classList.add('show');
    setTimeout(function() { msg.classList.remove('show'); }, 2500);
  }
  if (BM.ui) BM.ui.toast('Profile updated.', { type: 'success' });
}

// Load data and render (hardened: timeout + retry + cache via BM.data)
BM.loadStylists()
  .then(function(data) {
    STYLISTS = data.stylists;
    TAG_LABELS = data.tag_labels;
    BM.renderNav();
    render();
  })
  .catch(function(err) {
    BM.log.error('member: failed to load data', err);
    BM.renderNav();
    render();
  });
</script>
</body>
</html>
